{% extends 'base_modern.html' %}

{% block title %}Error{% endblock %}
{% block header_title %}Error{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 560px; margin: var(--spacing-2xl) auto;">
    <div class="empty-state">
        <i class="bi bi-exclamation-triangle" style="color: var(--warning);"></i>
        <h5>Oops! Something went wrong</h5>
        <p>{{ message }}</p>
        <a href="/" class="btn btn-primary mt-3">
            <i class="bi bi-house-door"></i> Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
